<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>LOCALIZANDO FAMILIA</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .contenedor {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .icono {
      font-size: 60px;
    }

    h1 {
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      padding: 15px;
      margin: 20px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 20px;
      margin-top: 15px;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .bien {
      background: #28a745;
      color: white;
    }

    .ayuda {
      background: #dc3545;
      color: white;
    }

    .cambiar {
      background: #6c757d;
      color: white;
      font-size: 14px;
      padding: 12px;
    }

    #pantallaPrincipal {
      display: none;
    }

    #pantallaSeleccion {
      display: block;
    }

    #mensaje {
      margin-top: 25px;
      font-size: 17px;
      font-weight: bold;
    }

    .nombre {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    /* ================================
   PANEL FAMILIA
================================ */

#panelFamilia {
  margin: 20px auto;
  max-width: 600px;
  padding: 20px;
  font-family: Arial, sans-serif;
}


/* Título */

#panelFamilia h2 {
  margin: 0 0 6px 0;
  font-size: 24px;
  text-align: center;
}

#fechaPanel {
  text-align: center;
  margin: 0 0 18px 0;
  color: #666;
  font-size: 14px;
}


/* Botón actualizar */

#panelFamilia > button {
  display: block;
  width: 100%;
  padding: 14px;
  margin-bottom: 18px;

  border: none;
  border-radius: 14px;

  background: #222;
  color: white;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
}

#panelFamilia > button:active {
  transform: scale(0.98);
}


/* ================================
   TARJETAS DE FAMILIA
================================ */

#listaFamilia {
  display: flex;
  flex-direction: column;
  gap: 12px;
}


.familiar {
  background: white;

  border-radius: 18px;

  padding: 18px;

  box-shadow:
    0 3px 12px rgba(0, 0, 0, 0.10);

  border: 1px solid #eeeeee;

  display: flex;
  flex-direction: column;

  gap: 8px;

  transition: transform 0.15s;
}


.familiar:active {
  transform: scale(0.98);
}


/* Nombre */

.familiar strong {
  font-size: 18px;
  color: #222;
}


/* Información */

.familiar div {
  font-size: 14px;
  color: #555;
}


/* ================================
   ESTADO SIN REGISTRO
================================ */

.familiar.sin-registro {
  background: #f5f5f5;
  border-left: 6px solid #999;
}

.familiar.sin-registro span {
  color: #777;
  font-size: 14px;
}


/* ================================
   BOTÓN UBICACIÓN
================================ */

.botonMapa {
  display: block;

  margin-top: 6px;

  padding: 12px;

  text-align: center;

  text-decoration: none;

  border-radius: 12px;

  background: #1976d2;

  color: white;

  font-size: 15px;

  font-weight: bold;
}


.botonMapa:active {
  transform: scale(0.97);
}


/* ================================
   ESTADOS
================================ */

.familiar:has(div:nth-child(2)) {
  position: relative;
}


/* ================================
   MÓVIL
================================ */

@media (max-width: 600px) {

  #panelFamilia {

    margin: 10px auto;

    padding: 14px;

    width: calc(100% - 28px);

  }


  #panelFamilia h2 {
    font-size: 22px;
  }


  .familiar {

    padding: 16px;

    border-radius: 16px;

  }


  .familiar strong {

    font-size: 17px;

  }


  .botonMapa {

    padding: 14px;

    font-size: 16px;

  }

}


/* ================================
   MODO OSCURO
================================ */

@media (prefers-color-scheme: dark) {

  #panelFamilia {
    color: #ffffff;
  }

  #panelFamilia h2 {
    color: #ffffff;
  }

  #fechaPanel {
    color: #bbbbbb;
  }

  .familiar {
    background: #1e1e1e;
    border-color: #333333;
    box-shadow:
      0 3px 12px rgba(0, 0, 0, 0.35);
  }

  .familiar strong {
    color: #ffffff;
  }

  .familiar div {
    color: #cccccc;
  }

  .familiar.sin-registro {
    background: #292929;
  }

  .familiar.sin-registro span {
    color: #aaaaaa;
  }

}

  </style>

</head>


<body>


<!-- ================================= -->
<!-- PANTALLA PARA SELECCIONAR PERSONA -->
<!-- ================================= -->

<div id="pantallaSeleccion">

  <div class="contenedor">

    <div class="icono">
      👨‍👩‍👧‍👦
    </div>

    <h1>LOCALIZANDO FAMILIA</h1>
   

    <p>
      ¿Quién eres?
    </p>


    <select id="persona">

      <option value="">
        Seleccionar familiar
      </option>

      <option value="Pedro Luis Martínez Sánchez">
        Pedro Luis Martínez Sánchez
      </option>

      <option value="Shelly Alexandra Torres Triviño">
        Shelly Alexandra Torres Triviño
      </option>

      <option value="Pedro León Martínez Sánchez">
        Pedro León Martínez Sánchez
      </option>

      <option value="Dora Sánchez Joven">
        Dora Sánchez Joven
      </option>

      <option value="Lina María Martínez Sánchez">
        Lina María Martínez Sánchez
      </option>

      <option value="Angie Natalia Martínez Sánchez">
        Angie Natalia Martínez Sánchez
      </option>

      <option value="Nini Yohanna Rincón">
        Nini Yohanna Rincón
      </option>

      <option value="Juan Gonzalo">
        Juan Gonzalo
      </option>

      <option value="Juan Sebastian Rivera">
        Juan Sebastian Rivera
      </option>

      <option value="Kevin Pacheco">
        Kevin Pacheco
      </option>
      
    </select>


    <button
      class="bien"
      onclick="guardarPersona()">

      CONTINUAR

    </button>

  </div>

</div>



<!-- ================================ -->
<!-- PANTALLA PRINCIPAL -->
<!-- ================================ -->

<div id="pantallaPrincipal">

  <div class="contenedor">

    <div class="icono">
      👨‍👩‍👧‍👦
    </div>

    <h1>LOCALIZANDO FAMILIA</h1>

    <div class="nombre"
         id="nombreUsuario">
    </div>


    <p>
      ¿Cómo estás?
    </p>


    <button
      class="bien"
      onclick="enviarEstado('ESTOY BIEN', 'NORMAL')">

      🟢 ESTOY BIEN

    </button>


    <button
      class="ayuda"
      onclick="enviarEstado('NECESITO AYUDA', 'EMERGENCIA')">

      🔴 NECESITO AYUDA

    </button>


    <button
      class="cambiar"
      onclick="cambiarPersona()">

      Cambiar familiar

    </button>
<section id="panelFamilia">

  <h2>Estado de mi familia hoy</h2>

  <p id="fechaPanel"></p>

  <button onclick="cargarRegistros()">
    🔄 Ver Estados
  </button>

  <div id="listaFamilia">
    Cargando...
  </div>

</section>

    <div id="mensaje"></div>

  </div>

</div>



<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbxJ-S74WVwbNZbNdrZ8LnvvdhMJGBbvSfkf8wH3BHeSgP5oY8SxG57HlcR3T2AWiM8c_w/exec";

// =====================================
// AL ABRIR LA APLICACIÓN
// =====================================

window.onload = function() {

  const personaGuardada =
    localStorage.getItem("familiaPersona");


  if (personaGuardada) {

    mostrarPantallaPrincipal(personaGuardada);

  } else {

    mostrarPantallaSeleccion();

  }

};



// =====================================
// GUARDAR PERSONA
// =====================================

function guardarPersona() {

  const persona =
    document.getElementById("persona").value;


  if (!persona) {

    alert("Selecciona quién eres.");

    return;

  }


  localStorage.setItem(
    "familiaPersona",
    persona
  );


  mostrarPantallaPrincipal(persona);

}



// =====================================
// MOSTRAR PRINCIPAL
// =====================================

function mostrarPantallaPrincipal(persona) {

  document.getElementById(
    "pantallaSeleccion"
  ).style.display = "none";


  document.getElementById(
    "pantallaPrincipal"
  ).style.display = "block";


  document.getElementById(
    "nombreUsuario"
  ).innerHTML = persona;

}



// =====================================
// MOSTRAR SELECCIÓN
// =====================================

function mostrarPantallaSeleccion() {

  document.getElementById(
    "pantallaSeleccion"
  ).style.display = "block";


  document.getElementById(
    "pantallaPrincipal"
  ).style.display = "none";

}



// =====================================
// CAMBIAR PERSONA
// =====================================

function cambiarPersona() {

  localStorage.removeItem(
    "familiaPersona"
  );


  mostrarPantallaSeleccion();

}



// =====================================
// ENVIAR ESTADO
// =====================================

function enviarEstado(estado, tipo) {

  const persona =
    localStorage.getItem("familiaPersona");


  const mensaje =
    document.getElementById("mensaje");


  if (!persona) {

    mensaje.innerHTML =
      "⚠️ No hay un familiar seleccionado.";

    return;

  }


  mensaje.innerHTML =
    "📍 Obteniendo ubicación...";


  if (!navigator.geolocation) {

    mensaje.innerHTML =
      "❌ Este dispositivo no permite obtener ubicación.";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(posicion) {

      mensaje.innerHTML =
        "📤 Enviando información...";


      const datos = {

        persona: persona,

        estado: estado,

        tipo: tipo,

        latitud:
          posicion.coords.latitude,

        longitud:
          posicion.coords.longitude,

        precision:
          posicion.coords.accuracy

      };


      google.script.run

        .withSuccessHandler(
          function(resultado) {

            if (
              resultado.resultado === "OK"
            ) {

              mensaje.innerHTML =
                "✅ Información enviada correctamente.";

            } else {

              mensaje.innerHTML =
                "❌ No se pudo guardar.";

            }

          }
        )


        .withFailureHandler(
          function(error) {

            console.error(error);

            mensaje.innerHTML =
              "❌ Error:<br>" +
              (error.message || error);

          }
        )


        .guardarRegistro(datos);

    },


    function(error) {

      console.error(error);

      mensaje.innerHTML =
        "❌ No fue posible obtener tu ubicación.";

    },


    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}
async function cargarRegistros() {

  const contenedor =
    document.getElementById("listaFamilia");

  const fecha = obtenerFechaHoy();

  document.getElementById("fechaPanel").textContent =
    "Registros del " + fecha;

  contenedor.innerHTML =
    "⏳ Consultando registros...";

  try {

    const respuesta = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body: JSON.stringify({

        accion: "consultarRegistros",

        fecha: fecha

      })

    });

    const datos = await respuesta.json();

    if (datos.resultado !== "OK") {

      throw new Error(
        "No se pudieron consultar los registros"
      );

    }

    mostrarRegistros(datos.registros);

  } catch (error) {

    console.error(error);

    contenedor.innerHTML =
      "❌ No se pudieron cargar los registros.";

  }

}
function obtenerFechaHoy() {

  const ahora = new Date();

  const año =
    ahora.getFullYear();

  const mes =
    String(
      ahora.getMonth() + 1
    ).padStart(2, "0");

  const dia =
    String(
      ahora.getDate()
    ).padStart(2, "0");

  return año + "-" + mes + "-" + dia;

}

function mostrarRegistros(registros) {

  const contenedor =
    document.getElementById("listaFamilia");

  const familiares = [

    "Pedro Luis Martínez Sánchez",

    "Shelly Alexandra Torres Triviño",

    "Pedro León Martínez Sánchez",

    "Dora Sánchez Joven",

    "Lina María Martínez Sánchez",

    "Angie Natalia Martínez Sánchez",

    "Nini Yohanna Rincón",

    "Juan Gonzalo",

    "Juan Sebastian Rivera",

    "Kevin Pacheco"

  ];

  let html = "";

  familiares.forEach(function(persona) {

    const registrosPersona =
      registros.filter(
        r => r.persona === persona
      );

    if (registrosPersona.length === 0) {

      html += `
        <div class="familiar sin-registro">

          <strong>${persona}</strong>

          <span>
            ⚪ Sin registro hoy
          </span>

        </div>
      `;

      return;

    }

    const ultimo =
      registrosPersona[
        registrosPersona.length - 1
      ];

    const esAyuda =
      ultimo.estado === "NECESITO AYUDA";

    const icono =
      esAyuda ? "🔴" : "🟢";

    let botonMapa = "";

    if (
      ultimo.latitud &&
      ultimo.longitud
    ) {

      const mapa =
        "https://www.google.com/maps?q=" +
        encodeURIComponent(
          ultimo.latitud +
          "," +
          ultimo.longitud
        );

      botonMapa = `
        <a
          href="${mapa}"
          target="_blank"
          class="botonMapa"
        >
          📍 Ver ubicación
        </a>
      `;

    }

    html += `

      <div class="familiar">

        <strong>
          ${persona}
        </strong>

        <div>
          ${icono}
          ${ultimo.estado}
        </div>

        <div>
          🕐 ${ultimo.hora}
        </div>

        ${botonMapa}

      </div>

    `;

  });

  contenedor.innerHTML = html;

}
</script>
<footer style="text-align: center; margin-top: 5px; padding: 5px;">
  <h2 style="font-size: 5px; margin: 0;">Desarrollado Por Pedro Luis Martinez Sanchez</h2>
</footer>

</body>

</html>
