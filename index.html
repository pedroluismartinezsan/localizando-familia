       BOTÓN MAPA
    ================================== */

    .resumenSin {

        background: #303030;

        color: #bbb;

/* =====================================

===================================== */


window.onload = function() {

  const personaGuardada =
    localStorage.getItem(
      "familiaPersona"
    );


  if (personaGuardada) {

    mostrarPantallaPrincipal(
      personaGuardada
    );

    comprobarNotificaciones();

  } else {

  }

async function activarNotificaciones() {

  const estado =
    document.getElementById(
      "estadoNotificaciones"
    );

  const boton =
    document.getElementById(
      "botonNotificaciones"
    );


  try {

    if (
      !("Notification" in window)
    ) {

      estado.textContent =
        "❌ Este dispositivo no permite notificaciones.";

      return;

    }


    estado.textContent =
      "⏳ Solicitando permiso...";


    const permiso =
      await Notification.requestPermission();


    if (permiso !== "granted") {

      estado.textContent =
        "❌ Las notificaciones no fueron permitidas.";

      return;

    }


    estado.textContent =
      "⏳ Registrando dispositivo...";


    const registro =
      await navigator.serviceWorker.register(
        "./firebase-messaging-sw.js"
      );


    const token =
      await messaging.getToken({

        serviceWorkerRegistration:
          registro,

        vapidKey:
          "BEK4AKZmhOpwX7SnMFoOx9s0etxLNtH5TnoY7iT47pt3HW0MRKzqoKh1BnYjNJK71t6yqkWL0ySWI31o49maflA"

      });


    if (!token) {

      throw new Error(
        "Firebase no devolvió un token."
      );

    }


    const persona =
      localStorage.getItem(
        "familiaPersona"
      );


    const respuesta =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              accion:
                "guardarDispositivo",

              persona:
                persona,

              token:
                token

            })

        }
      );


    const resultado =
      await respuesta.json();


    if (
      resultado.resultado !== "OK"
    ) {

      throw new Error(
        "No se pudo guardar el dispositivo."
      );

    }


    estado.textContent =
      "✅ Notificaciones activadas correctamente.";


    boton.textContent =
      "✅ NOTIFICACIONES ACTIVADAS";


    boton.classList.add(
      "activadas"
    );


  } catch (error) {

    console.error(
      "Error notificacaciones:",
      error
    );


    estado.textContent =
      "❌ No se pudieron activar las notificaciones.";

  }

}
async function comprobarNotificaciones() {

  const estado =
    document.getElementById(
      "estadoNotificaciones"
    );

  const boton =
    document.getElementById(
      "botonNotificaciones"
    );


  if (
    !("Notification" in window)
  ) {

    estado.textContent =
      "❌ Este dispositivo no permite notificaciones.";

    return;

  }


  if (
    Notification.permission ===
    "granted"
  ) {

    estado.textContent =
      "✅ Las notificaciones están permitidas.";

    boton.textContent =
      "✅ NOTIFICACIONES ACTIVADAS";

    boton.classList.add(
      "activadas"
    );

  } else {

    estado.textContent =
      "Las notificaciones todavía no están activadas.";

  }

}

/* =====================================
   GUARDAR PERSONA
===================================== */


function guardarPersona() {

  const persona =
    document.getElementById(
      "persona"
    ).value;


  if (!persona) {

    alert(
      "Selecciona quién eres."
    );

    return;

  }


  localStorage.setItem(
    "familiaPersona",
    persona
  );


  mostrarPantallaPrincipal(
    persona
  );

}



/* =====================================
   MOSTRAR PRINCIPAL
===================================== */


function mostrarPantallaPrincipal(
  persona
) {

  document.getElementById(
    "pantallaSeleccion"
  ).style.display = "none";


  document.getElementById(
    "pantallaPrincipal"
  ).style.display = "block";


  document.getElementById(
    "nombreUsuario"
  ).textContent = persona;


  cargarRegistros();

}



/* =====================================
   MOSTRAR SELECCIÓN
===================================== */


function mostrarPantallaSeleccion() {

  document.getElementById(
    "pantallaSeleccion"
  ).style.display = "block";


  document.getElementById(
    "pantallaPrincipal"
  ).style.display = "none";

}



/* =====================================
   CAMBIAR PERSONA
===================================== */


function cambiarPersona() {

  localStorage.removeItem(
    "familiaPersona"
  );


  mostrarPantallaSeleccion();

}



/* =====================================
   ENVIAR ESTADO
===================================== */


async function enviarEstado(
  estado,
  tipo
) {

  const persona =
    localStorage.getItem(
      "familiaPersona"
    );


  const mensaje =
    document.getElementById(
      "mensaje"
    );


  if (!persona) {

    mensaje.textContent =
      "⚠️ No hay un familiar seleccionado.";

    return;

  }


  mensaje.textContent =
    "📍 Obteniendo ubicación...";


  if (!navigator.geolocation) {

    mensaje.textContent =
      "❌ Este dispositivo no permite obtener ubicación.";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    async function(posicion) {

      mensaje.textContent =
        "📤 Enviando información...";


      const datos = {

        accion: "guardarRegistro",

        persona: persona,

        estado: estado,

        tipo: tipo,

        latitud:
          posicion.coords.latitude,

        longitud:
          posicion.coords.longitude,

        precision:
          posicion.coords.accuracy

      };


      try {

        const respuesta =
          await fetch(
            API_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify(datos)

            }
          );


        const resultado =
          await respuesta.json();


        if (
          resultado.resultado === "OK"
        ) {

          mensaje.textContent =
            "✅ Información enviada correctamente.";

          cargarRegistros();

        } else {

          mensaje.textContent =
            "❌ No se pudo guardar.";

        }


      } catch (error) {

        console.error(error);

        mensaje.textContent =
          "❌ Error al enviar la información.";

      }

    },


    function(error) {

      console.error(error);

      mensaje.textContent =
        "❌ No fue posible obtener tu ubicación.";

    },


    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}



/* =====================================
   FECHA ACTUAL
===================================== */

  const mes =

/* =====================================
   CONSULTAR REGISTROS
===================================== */


async function cargarRegistros() {

  const contenedor =
    document.getElementById(
      "listaFamilia"
    );


  const fecha =
    obtenerFechaHoy();


  document.getElementById(
    "fechaPanel"
  ).textContent =
    "Registros del " + fecha;


  contenedor.innerHTML =
    '<div class="cargando">' +
    '⏳ Consultando registros...' +
    '</div>';


  try {

    const respuesta =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              accion:
                "consultarRegistros",

              fecha:
                fecha

            })

        }
      );


    const datos =
      await respuesta.json();


    if (
      datos.resultado !== "OK"
    ) {

      throw new Error(
        "No se pudieron consultar los registros."
      );

    }


    mostrarRegistros(
      datos.registros || []
    );


  } catch (error) {

    console.error(error);

    contenedor.innerHTML =
      '<div class="error">' +
      '❌ No se pudieron cargar los registros.' +
      '<br><br>' +
      'Revisa que Apps Script tenga activa la función consultarRegistros.' +
      '</div>';

  }

}



/* =====================================
   MOSTRAR REGISTROS
===================================== */


function mostrarRegistros(
  registros
) {

  const contenedor =
    document.getElementById(
      "listaFamilia"
    );


  let cantidadBien = 0;

  let cantidadAyuda = 0;

  let cantidadSin = 0;


  let html = "";


  familiares.forEach(
    function(persona) {


      const registrosPersona =
        registros.filter(
          function(registro) {

            return (
              String(
                registro.persona
              ).trim() ===
              persona
            );

          }
        );


      /* ==============================
         SIN REGISTRO
      ============================== */


      if (
        registrosPersona.length === 0
      ) {

        cantidadSin++;


        html += `

          <div class="familiar sin-registro">

            <strong>
              ⚪ ${persona}
            </strong>

            <span>
              Sin registro hoy
            </span>

          </div>

        `;


        return;

      }



      /* ==============================
         ÚLTIMO REGISTRO
      ============================== */


      const ultimo =
        registrosPersona[
          registrosPersona.length - 1
        ];


      const esAyuda =
        String(
          ultimo.estado || ""
        ).toUpperCase() ===
        "NECESITO AYUDA";


      if (esAyuda) {

        cantidadAyuda++;

      } else {

        cantidadBien++;

      }


      const icono =
        esAyuda
          ? "🔴"
          : "🟢";


      const estado =
        ultimo.estado ||
        "SIN ESTADO";


      const hora =
        ultimo.hora ||
        "--";


      const latitud =
        ultimo.latitud;


      const longitud =
        ultimo.longitud;


      let botonMapa = "";


      if (
        latitud !== undefined &&
        latitud !== null &&
        latitud !== "" &&
        longitud !== undefined &&
        longitud !== null &&
        longitud !== ""
      ) {


        const mapa =
          "https://www.google.com/maps?q=" +
          encodeURIComponent(
            latitud +
            "," +
            longitud
          );


        botonMapa = `

          <a
            href="${mapa}"
            target="_blank"
            rel="noopener noreferrer"
            class="botonMapa"
          >

            📍 VER UBICACIÓN

          </a>

        `;

      }



      let precisionTexto = "";


      if (
        ultimo.precision !== undefined &&
        ultimo.precision !== null &&
        ultimo.precision !== ""
      ) {

        precisionTexto =
          "🎯 Precisión aproximada: " +
          Math.round(
            Number(
              ultimo.precision
            )
          ) +
          " m";

      }



      html += `

        <div class="familiar">

          <strong>
            ${icono} ${persona}
          </strong>

          <div class="estadoRegistro">

            ${estado}

          </div>

          <div class="horaRegistro">

            🕐 ${hora}

          </div>

          ${
            precisionTexto
              ? `<div class="precisionRegistro">
                   ${precisionTexto}
                 </div>`
              : ""
          }

          ${botonMapa}

        </div>

      `;

    }
  );


  contenedor.innerHTML =
    html;


  document.getElementById(
    "cantidadBien"
  ).textContent =
    cantidadBien;


  document.getElementById(
    "cantidadAyuda"
  ).textContent =
    cantidadAyuda;


  document.getElementById(
    "cantidadSin"
  ).textContent =
    cantidadSin;

}


</script>
