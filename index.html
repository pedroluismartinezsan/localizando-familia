       <option value="Nini Yohanna Rincón">

    <button

<div id="pantallaPrincipal">

  <div class="contenedor">

    <div class="icono">
      👨‍👩‍👧‍👦
    </div>

    <h1>LOCALIZANDO FAMILIA</h1>

    <div class="nombre"
         id="nombreUsuario">
    </div>


    <p>¿Cómo estás?</p>


    <button
      class="bien"
      onclick="enviarEstado('ESTOY BIEN', 'NORMAL')">

      🟢 ESTOY BIEN

    </button>


    <button
      class="ayuda"
      onclick="enviarEstado('NECESITO AYUDA', 'EMERGENCIA')">

    </button>

      class="notificaciones"
      onclick="activarNotificaciones()">
    
      🔔 ACTIVAR NOTIFICACIONES
    
    </button>

      class="cambiar"
      onclick="cambiarPersona()">

      Cambiar familiar

    </button>

  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyDh-I8sewGb5YvKGjxsdcLooQqz7ybgPi4",
  authDomain: "localizando-familia.firebaseapp.com",
  projectId: "localizando-familia",
  storageBucket: "localizando-familia.firebasestorage.app",
  messagingSenderId: "1081866124616",
  appId: "1:1081866124616:web:72a5452cd8f6a4db62077d"
});

const messaging = firebase.messaging();
// =====================================
// URL DE APPS SCRIPT
// =====================================
//CONECTAR 
const API_URL =
"https://script.google.com/macros/s/AKfycbxJ-S74WVwbNZbNdrZ8LnvvdhMJGBbvSfkf8wH3BHeSgP5oY8SxG57HlcR3T2AWiM8c_w/exec";



// =====================================
// INICIO
// =====================================

window.onload = function() {

  registrarServiceWorker();


  const personaGuardada =
    localStorage.getItem("familiaPersona");


  if (personaGuardada) {

    mostrarPantallaPrincipal(
      personaGuardada
    );

  } else {

    mostrarPantallaSeleccion();

  }

};



// =====================================
// SERVICE WORKER
// =====================================

function registrarServiceWorker() {

  if ("serviceWorker" in navigator) {

    navigator.serviceWorker
      .register("sw.js")
      .then(function() {

        console.log(
          "Service Worker registrado"
        );

      })
      .catch(function(error) {

        console.error(
          "Error Service Worker:",
          error
        );

      });

  }

}



// =====================================
// GUARDAR PERSONA
// =====================================

function guardarPersona() {

  const persona =
    document.getElementById("persona").value;


  if (!persona) {

    alert(
      "Selecciona quién eres."
    );

    return;

  }


  localStorage.setItem(
    "familiaPersona",
    persona
  );


  mostrarPantallaPrincipal(
    persona
  );

}



// =====================================
// MOSTRAR PRINCIPAL
// =====================================

function mostrarPantallaPrincipal(
  persona
) {

  document.getElementById(
    "pantallaSeleccion"
  ).style.display = "none";


  document.getElementById(
    "pantallaPrincipal"
  ).style.display = "block";


  document.getElementById(
    "nombreUsuario"
  ).innerHTML = persona;

}



// =====================================
// SELECCIÓN
// =====================================

function mostrarPantallaSeleccion() {

  document.getElementById(
    "pantallaSeleccion"
  ).style.display = "block";


  document.getElementById(
    "pantallaPrincipal"
  ).style.display = "none";

}



// =====================================
// CAMBIAR PERSONA
// =====================================

function cambiarPersona() {

  localStorage.removeItem(
    "familiaPersona"
  );


  mostrarPantallaSeleccion();

}

async function activarNotificaciones() {

  const mensaje =
    document.getElementById("mensaje");

  try {

    if (!("Notification" in window)) {

      mensaje.innerHTML =
        "❌ Este dispositivo no admite notificaciones.";

      return;
    }


    const permiso =
      await Notification.requestPermission();


    if (permiso !== "granted") {

      mensaje.innerHTML =
        "❌ Permiso de notificaciones: " + permiso;

      return;
    }


    const registro =
      await navigator.serviceWorker.register(
        "./firebase-messaging-sw.js"
      );


    const token =
      await messaging.getToken({

        vapidKey:
          "BEK4AKZmhOpwX7SnMFoOx9s0etxLNtH5TnoY7iT47pt3HW0MRKzqoKh1BnYjNJK71t6yqkWL0ySWI31o49maflA",

        serviceWorkerRegistration:
          registro

      });


    if (!token) {

      mensaje.innerHTML =
        "❌ Firebase no pudo obtener el token.";

      return;
    }


    console.log("TOKEN FCM:", token);
    const persona = document.getElementById("persona").value;

if (!persona) {
  mensaje.innerHTML =
    "⚠️ Primero selecciona tu nombre.";
  return;
}

await fetch(API_URL, {
  method: "POST",
  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify({
    accion: "registrarDispositivo",
    persona: persona,
    token: token
  })
});

mensaje.innerHTML =
  "✅ Notificaciones activadas y teléfono registrado.";
   /* const API_URL =
    "https://script.google.com/macros/s/AKfycbxJ-S74WVwbNZbNdrZ8LnvvdhMJGBbvSfkf8wH3BHeSgP5oY8SxG57HlcR3T2AWiM8c_w/exec";
*/
    mensaje.innerHTML =
      "✅ Notificaciones activadas correctamente.";

  }

  catch (error) {

    console.error(
      "Error Firebase Messaging:",
      error
    );


    mensaje.innerHTML =
      "❌ Error al activar las notificaciones:<br>" +
      error.message;

  }

}

// =====================================
// ENVIAR ESTADO
// =====================================

function enviarEstado(
  estado,
  tipo
) {

  const persona =
    localStorage.getItem(
      "familiaPersona"
    );


  const mensaje =
    document.getElementById(
      "mensaje"
    );


  if (!persona) {

    mensaje.innerHTML =
      "⚠️ No hay un familiar seleccionado.";

    return;

  }


  mensaje.innerHTML =
    "📍 Obteniendo ubicación...";


  if (!navigator.geolocation) {

    mensaje.innerHTML =
      "❌ Este dispositivo no permite obtener ubicación.";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(posicion) {

      mensaje.innerHTML =
        "📤 Enviando información...";


      const datos = {

        persona: persona,

        estado: estado,

        tipo: tipo,

        latitud:
          posicion.coords.latitude,

        longitud:
          posicion.coords.longitude,

        precision:
          posicion.coords.accuracy

      };


      fetch(
        API_URL,
        {

          method: "POST",

          body:
            JSON.stringify(datos)

        }
      )

      .then(function(respuesta) {

        return respuesta.json();

      })

      .then(function(resultado) {

        if (
          resultado.resultado === "OK"
        ) {

          mensaje.innerHTML =
            "✅ Información enviada correctamente.";

        } else {

          mensaje.innerHTML =
            "❌ No se pudo guardar.";

        }

      })

      .catch(function(error) {

        console.error(error);

        mensaje.innerHTML =
          "❌ Error de conexión.";

      });

    },


    function(error) {

      console.error(error);

      mensaje.innerHTML =
        "❌ No fue posible obtener tu ubicación.";

    },


    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}


</script>
